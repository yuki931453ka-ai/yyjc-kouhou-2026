<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#0a0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>広報総務委員会 公開委員会発表</title>
<style>
:root {
  --bg: #0a0a14;
  --surface: #16162a;
  --text: #e0e0e8;
  --text-dim: #888899;
  --accent: #4a90d9;
  --accent-glow: rgba(74, 144, 217, 0.15);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

.viewer {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}

.slide-area {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.slide-container {
  position: relative;
  width: 100%;
  max-width: 1200px;
  aspect-ratio: 16 / 9;
  max-height: calc(100vh - 64px);
}

.slide-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}
.slide-img.active {
  opacity: 1;
  pointer-events: auto;
}

.tap-zone {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 40%;
  z-index: 10;
  cursor: pointer;
}
.tap-zone.prev { left: 0; }
.tap-zone.next { right: 0; }

.nav-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  z-index: 15;
}
.nav-arrow.prev { left: 12px; }
.nav-arrow.next { right: 12px; }
.nav-arrow svg { fill: rgba(255,255,255,0.7); width: 20px; height: 20px; }

.slide-area:hover .nav-arrow,
.slide-area:focus-within .nav-arrow {
  opacity: 1;
}

.bottom-bar {
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 0 16px;
  background: var(--surface);
  border-top: 1px solid rgba(255,255,255,0.06);
  flex-shrink: 0;
}

.slide-counter {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0.5px;
  min-width: 64px;
  text-align: center;
}
.slide-counter .current { color: var(--accent); font-size: 18px; }
.slide-counter .sep { color: var(--text-dim); margin: 0 2px; }
.slide-counter .total { color: var(--text-dim); }

.dot-nav {
  display: flex;
  gap: 6px;
  align-items: center;
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  transition: all 0.3s;
  cursor: pointer;
}
.dot.active {
  background: var(--accent);
  width: 18px;
  border-radius: 3px;
}

.fullscreen-btn {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.2s;
}
.fullscreen-btn:hover { background: rgba(255,255,255,0.12); }
.fullscreen-btn svg { fill: var(--text-dim); width: 18px; height: 18px; }

.header {
  height: 8px;
  flex-shrink: 0;
}
.progress-bar {
  height: 100%;
  background: var(--accent);
  transition: width 0.3s ease;
  border-radius: 0 2px 2px 0;
}

@media (max-width: 640px) {
  .nav-arrow { display: none; }
  .bottom-bar { height: 48px; gap: 10px; }
  .slide-counter { font-size: 12px; min-width: 48px; }
  .slide-counter .current { font-size: 15px; }
  .dot { width: 5px; height: 5px; }
  .dot.active { width: 14px; }
  .fullscreen-btn { width: 32px; height: 32px; }
}

@media (max-width: 360px) {
  .dot-nav { display: none; }
}
</style>
</head>
<body>

<div class="viewer">
  <div class="header">
    <div class="progress-bar" id="progress"></div>
  </div>

  <div class="slide-area" id="slideArea">
    <div class="slide-container" id="slideContainer"></div>
    <div class="tap-zone prev" id="tapPrev"></div>
    <div class="tap-zone next" id="tapNext"></div>
    <div class="nav-arrow prev">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </div>
    <div class="nav-arrow next">
      <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="slide-counter">
      <span class="current" id="currentSlide">1</span><span class="sep">/</span><span class="total">17</span>
    </div>
    <div class="dot-nav" id="dotNav"></div>
    <button class="fullscreen-btn" id="fsBtn" title="全画面">
      <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>
  </div>
</div>

<script>
const TOTAL = 17;
let current = 1;
let touchStartX = 0;
let touchStartY = 0;
let swiping = false;

const container = document.getElementById('slideContainer');
const progress = document.getElementById('progress');
const currentEl = document.getElementById('currentSlide');
const dotNav = document.getElementById('dotNav');

for (let i = 1; i <= TOTAL; i++) {
  const img = document.createElement('img');
  img.className = 'slide-img' + (i === 1 ? ' active' : '');
  img.dataset.slide = i;
  img.alt = 'Slide ' + i;
  if (i <= 3) {
    img.src = 'slides/slide_' + String(i).padStart(2, '0') + '.jpg';
  } else {
    img.loading = 'lazy';
    img.dataset.src = 'slides/slide_' + String(i).padStart(2, '0') + '.jpg';
  }
  container.appendChild(img);

  const dot = document.createElement('div');
  dot.className = 'dot' + (i === 1 ? ' active' : '');
  dot.dataset.slide = i;
  dot.addEventListener('click', () => goTo(i));
  dotNav.appendChild(dot);
}

function preloadAround(n) {
  for (let offset = -1; offset <= 2; offset++) {
    const idx = n + offset;
    if (idx < 1 || idx > TOTAL) continue;
    const img = container.querySelector(`[data-slide="${idx}"]`);
    if (img && !img.src && img.dataset.src) {
      img.src = img.dataset.src;
    }
  }
}

function goTo(n) {
  if (n < 1 || n > TOTAL) return;
  container.querySelector('.slide-img.active').classList.remove('active');
  container.querySelector(`[data-slide="${n}"]`).classList.add('active');
  dotNav.querySelector('.dot.active').classList.remove('active');
  dotNav.children[n - 1].classList.add('active');
  current = n;
  currentEl.textContent = n;
  progress.style.width = ((n / TOTAL) * 100) + '%';
  preloadAround(n);
}

function prev() { goTo(current - 1); }
function next() { goTo(current + 1); }

document.getElementById('tapPrev').addEventListener('click', prev);
document.getElementById('tapNext').addEventListener('click', next);

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prev(); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); next(); }
  if (e.key === 'Home') { e.preventDefault(); goTo(1); }
  if (e.key === 'End') { e.preventDefault(); goTo(TOTAL); }
});

const slideArea = document.getElementById('slideArea');
slideArea.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  swiping = true;
}, { passive: true });

slideArea.addEventListener('touchend', (e) => {
  if (!swiping) return;
  swiping = false;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
    dx < 0 ? next() : prev();
  }
}, { passive: true });

document.getElementById('fsBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
});

preloadAround(1);
goTo(1);
</script>
</body>
</html>
